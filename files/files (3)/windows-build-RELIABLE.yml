  build-windows-wheel:
    name: Build Windows Wheel (x64) - Pre-built Approach
    needs: run-tests
    runs-on: windows-latest

    steps:
      - name: Clone MLC-LLM
        run: git clone --recursive https://github.com/mlc-ai/mlc-llm.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with pre-built TVM
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy torch transformers pytest packaging
          # Install pre-built TVM (no LLVM compilation needed!)
          pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cpu

      - name: Build Python wheel (no C++ compilation)
        run: |
          Push-Location mlc-llm/python
          
          Write-Host "Building MLC-LLM wheel using pre-installed TVM..."
          python setup.py bdist_wheel
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Wheel build failed!"
            Pop-Location
            exit 1
          }
          
          Pop-Location
          
          Write-Host "`n✅ Wheel created:"
          Get-ChildItem mlc-llm\python\dist\*.whl | Format-Table Name, Length

      - name: Test wheel installation
        run: |
          pip install (Get-ChildItem mlc-llm\python\dist\*.whl).FullName
          python -c "import mlc_llm; print('✅ MLC-LLM imported successfully')"

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: mlc-llm-windows-x64-wheel
          path: mlc-llm/python/dist/*.whl
          retention-days: 30

      - name: Build summary
        run: |
          $wheel = Get-ChildItem mlc-llm\python\dist\*.whl | Select-Object -First 1
          @"
### Windows Wheel Built ✅

**Platform:** Windows x86_64
**File:** $($wheel.Name)
**Size:** $([math]::Round($wheel.Length/1MB, 2)) MB
**Build Method:** Pre-built TVM (reliable, fast, no LLVM issues)
**Build Time:** ~2 minutes
"@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
