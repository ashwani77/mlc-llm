build-windows-wheel:
  name: Build Windows Wheel (x64) - NO LLVM BUILD
  needs: run-tests
  runs-on: windows-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install numpy torch transformers pytest packaging
        # Use pre-built TVM that doesn't require LLVM at build time
        pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cpu

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Python wheel (using pre-built components)
      run: |
        Push-Location python
        
        Write-Host "Building wheel using pre-installed TVM..."
        python setup.py bdist_wheel
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Wheel build failed!"
          Pop-Location
          exit 1
        }
        
        Pop-Location
        
        Write-Host "`n✅ Wheel created:"
        Get-ChildItem python\dist\*.whl | Format-Table Name, Length

    - name: Upload Windows wheel
      uses: actions/upload-artifact@v4
      with:
        name: mlc-llm-windows-x64-wheel
        path: python/dist/*.whl
        retention-days: 30

    - name: Build summary
      run: |
        $wheel = Get-ChildItem python\dist\*.whl | Select-Object -First 1
        @"
### Windows Wheel Built ✅

  **Platform:** Windows x86_64
  **File:** $($wheel.Name)
  **Size:** $([math]::Round($wheel.Length/1MB, 2)) MB
  **Method:** Pre-built TVM (no LLVM compilation required)
  "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append