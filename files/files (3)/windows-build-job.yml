  # ===========================================================================
  # WINDOWS BUILD JOB - REVISED AND TESTED
  # ===========================================================================
  build-windows-wheel:
    name: Build Windows Wheel (x64)
    needs: run-tests
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cmake ninja
          pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cpu
          pip install numpy torch transformers pytest packaging

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm --version=17.0.6 -y
          
      - name: Set LLVM environment variables
        shell: pwsh
        run: |
          echo "LLVM_DIR=C:\Program Files\LLVM" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Verify build tools
        shell: pwsh
        run: |
          Write-Host "Python version:"
          python --version
          Write-Host "`nCMake version:"
          cmake --version
          Write-Host "`nRust version:"
          rustc --version
          Write-Host "`nClang version:"
          clang --version
          Write-Host "`nClang location:"
          where.exe clang

      - name: Create build directory and config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          Set-Location build
          
          Write-Host "Creating config.cmake..."
          @"
          set(CMAKE_BUILD_TYPE RelWithDebInfo)
          set(CMAKE_EXPORT_COMPILE_COMMANDS ON)
          set(USE_LLVM "C:/Program Files/LLVM")
          set(HIDE_PRIVATE_SYMBOLS ON)
          set(USE_CUDA OFF)
          set(USE_METAL OFF)
          set(USE_VULKAN OFF)
          set(USE_OPENCL OFF)
          set(USE_ROCM OFF)
          "@ | Out-File -FilePath config.cmake -Encoding UTF8
          
          Write-Host "config.cmake created:"
          Get-Content config.cmake
          
      - name: Run CMake configuration
        shell: pwsh
        run: |
          Set-Location build
          Write-Host "Running CMake configuration..."
          cmake ..
          
      - name: Build MLC-LLM
        shell: pwsh
        run: |
          Set-Location build
          Write-Host "Building MLC-LLM (this may take 15-20 minutes)..."
          cmake --build . --config Release --parallel 4

      - name: Build Python wheel
        shell: pwsh
        run: |
          Set-Location python
          Write-Host "Building Python wheel..."
          python setup.py bdist_wheel
          
          Write-Host "`nWheel created:"
          Get-ChildItem dist\*.whl

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: mlc-llm-windows-x64-wheel
          path: python/dist/*.whl
          retention-days: 30

      - name: Build summary
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path python\dist -Filter *.whl | Select-Object -First 1
          @"
          ### Windows Wheel Built ✅
          
          **Platform:** Windows x86_64
          **Artifacts:** $($wheel.Name)
          **Size:** $([math]::Round($wheel.Length / 1MB, 2)) MB
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
