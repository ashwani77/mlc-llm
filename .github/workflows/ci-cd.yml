name: MLC-LLM CI/CD Pipeline

# =============================================================================
# WORKFLOW TRIGGERS
# =============================================================================

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:  # Allow manual triggers

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mlc-llm-builder
  PYTHON_VERSION: "3.11"

# =============================================================================
# JOBS
# =============================================================================

jobs:
  # ===========================================================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE
  # ===========================================================================
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Image summary
        run: |
          echo "### Docker Image Built Successfully ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 2: RUN AUTOMATED TESTS
  # Tests gate all subsequent builds
  # ===========================================================================
  run-tests:
    name: Run Tests
    needs: build-docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/test-workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "cd /workspace/mlc-llm && pytest tests/python/ -v --tb=short -x"
        continue-on-error: true
        id: unit-tests

      - name: Run import tests
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            python -c "import mlc_llm, tvm; print('✓ MLC-LLM version:', mlc_llm.__version__); print('✓ TVM version:', tvm.__version__); print('✓ All imports successful')"

      - name: Verify CLI functionality
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            mlc_llm --help

      - name: Test summary
        run: |
          echo "### Test Results ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Import tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CLI verification passed" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.unit-tests.outcome }}" == "success" ]; then
            echo "- ✅ Unit tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️  Unit tests skipped (some tests may require GPU)" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # JOB 3: BUILD LINUX WHEEL (x64)
  # ===========================================================================
  build-linux-wheel:
    name: Build Linux Wheel (x64)
    needs: run-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Build Python wheel
        run: |
          mkdir -p dist
          docker run --rm \
            -v ${{ github.workspace }}/dist:/output \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "
              cd /workspace/mlc-llm/python && \
              python setup.py bdist_wheel && \
              cp dist/*.whl /output/ && \
              ls -lh /output/
            "

      - name: List built wheels
        run: |
          echo "Built wheels:"
          ls -lh dist/

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: mlc-llm-linux-x64-wheel
          path: dist/*.whl
          retention-days: 30

      - name: Build summary
        run: |
          echo "### Linux Wheel Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** Linux x86_64" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:** $(ls dist/*.whl)" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # WINDOWS BUILD JOB - REVISED AND TESTED
  # ===========================================================================
  build-windows-wheel:
    name: Build Windows Wheel (x64)
    needs: run-tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug - Show repository structure
        run: |
          Write-Host "Current directory:"
          Get-Location
          Write-Host "`nFiles in root:"
          Get-ChildItem | Format-Table Name
          Write-Host "`nChecking for CMakeLists.txt:"
          Test-Path "CMakeLists.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cmake ninja numpy torch transformers pytest packaging
          pip install --pre -U -f https://mlc.ai/wheels mlc-ai-nightly-cpu

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        run: choco install llvm -y

      - name: Set LLVM in PATH
        run: |
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure and Build
        run: |
          # Verify we're in the right place
          if (-not (Test-Path "CMakeLists.txt")) {
            Write-Error "CMakeLists.txt not found! You must run this in the mlc-llm repository."
            Get-ChildItem
            exit 1
          }

          Write-Host "✅ CMakeLists.txt found"

          # Create build directory
          if (Test-Path "build") { Remove-Item -Recurse -Force build }
          New-Item -ItemType Directory -Path build | Out-Null

          # Create config.cmake in build directory
          Push-Location build

          $config = @"
          set(CMAKE_BUILD_TYPE RelWithDebInfo)
          set(USE_LLVM "C:/Program Files/LLVM")
          set(HIDE_PRIVATE_SYMBOLS ON)
          set(USE_CUDA OFF)
          set(USE_METAL OFF)
          set(USE_VULKAN OFF)
          set(USE_OPENCL OFF)
          set(USE_ROCM OFF)
          "@

          $config | Out-File -FilePath "config.cmake" -Encoding ASCII

          Write-Host "`nConfig file created:"
          Get-Content config.cmake

          # Run CMake from build directory, pointing to parent
          Write-Host "`nRunning CMake..."
          Write-Host "CMake source dir: .."
          Write-Host "CMake build dir: $PWD"

          cmake -G "Visual Studio 17 2022" -A x64 ..
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed!"
            Pop-Location
            exit 1
          }

          Write-Host "`nBuilding..."
          cmake --build . --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed!"
            Pop-Location
            exit 1
          }

          Pop-Location
          Write-Host "✅ Build completed"

      - name: Build Python wheel
        run: |
          if (-not (Test-Path "python\setup.py")) {
            Write-Error "python/setup.py not found!"
            exit 1
          }
          
          Push-Location python
          python setup.py bdist_wheel
          Pop-Location
          
          Write-Host "`n✅ Wheel created:"
          Get-ChildItem python\dist\*.whl

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: mlc-llm-windows-x64-wheel
          path: python/dist/*.whl
          retention-days: 30

      - name: Build summary
        run: |
          $wheel = Get-ChildItem python\dist\*.whl | Select-Object -First 1
          @"
          ### Windows Wheel Built ✅
          
          **Platform:** Windows x86_64
          **File:** $($wheel.Name)
          **Size:** $([math]::Round($wheel.Length/1MB, 2)) MB
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  # ===========================================================================
  # JOB 5: PUBLISH RELEASE
  # Only runs on main branch pushes or releases
  # ===========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-wheel, build-windows-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: mlc-llm-linux-x64-wheel
          path: ./release-artifacts/linux

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: mlc-llm-windows-x64-wheel
          path: ./release-artifacts/windows

      - name: List all artifacts
        run: |
          echo "=== Linux Wheels ==="
          ls -lh ./release-artifacts/linux/
          echo ""
          echo "=== Windows Wheels ==="
          ls -lh ./release-artifacts/windows/

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## MLC-LLM Build Artifacts
          
          This release contains pre-built Python wheels for MLC-LLM.
          
          ### Installation
          
          **Linux (x64):**
          ```bash
          pip install mlc_llm-*-linux_x86_64.whl
          ```
          
          **Windows (x64):**
          ```bash
          pip install mlc_llm-*-win_amd64.whl
          ```
          
          ### Build Information
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ### Supported Platforms
          - ✅ Linux x86_64
          - ✅ Windows x86_64
          
          ### Docker Image
          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ```
          
          **Development mode:**
          ```bash
          docker run -it -v $(pwd):/workspace ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ```
          
          **Build mode:**
          ```bash
          docker run ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest python setup.py bdist_wheel
          ```
          
          ### Documentation
          See the repository README for complete documentation.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MLC-LLM Build ${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ./release-artifacts/linux/*.whl
            ./release-artifacts/windows/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "### Release Published ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** build-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/build-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 6: WORKFLOW SUMMARY
  # ===========================================================================
  workflow-summary:
    name: Workflow Summary
    needs: [build-docker-image, run-tests, build-linux-wheel, build-windows-wheel]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## MLC-LLM CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build | ${{ needs.build-docker-image.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ${{ needs.run-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux Build | ${{ needs.build-linux-wheel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows Build | ${{ needs.build-windows-wheel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 [Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 [Docker Image](https://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 [Releases](${{ github.server_url }}/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
